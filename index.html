<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Platter - Homemade Meals</title>
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                primary: 'var(--color-primary)',
                secondary: 'var(--color-secondary)',
                dark: 'var(--color-dark)',
                light: 'var(--color-light)',
              },
              background: 'var(--color-background)',
              text: 'var(--color-text)',
            },
            fontFamily: {
                sans: ['Inter', 'sans-serif'],
                serif: ['Playfair Display', 'serif'],
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
               'fade-in-very-fast': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'slide-up': {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              'slide-in-stagger': {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              'lift-up': {
                '0%': { transform: 'translateY(0)', boxShadow: 'var(--tw-shadow)' },
                '100%': { transform: 'translateY(-8px)', boxShadow: 'var(--tw-shadow-xl)' },
              },
              'press': {
                  '0%': { transform: 'scale(1)' },
                  '50%': { transform: 'scale(0.95)' },
                  '100%': { transform: 'scale(1)' },
              },
              'pulse-border': {
                '0%, 100%': { borderColor: 'transparent' },
                '50%': { borderColor: 'var(--color-primary)' },
              },
              'snowfall': {
                '0%': { transform: 'translateY(-10vh) translateX(var(--tw-translate-x)) rotate(0deg)', opacity: '1' },
                '100%': { transform: 'translateY(110vh) translateX(calc(var(--tw-translate-x) + 10vw)) rotate(360deg)', opacity: '0' },
              },
              'diya-float': {
                '0%, 100%': { transform: 'translateY(0) rotate(-1deg)', opacity: '0.8' },
                '50%': { transform: 'translateY(-10px) rotate(1deg)', opacity: '1' },
              },
              'gentle-fall': {
                '0%': { transform: 'translateY(-10vh) rotate(0deg)', opacity: '1' },
                '100%': { transform: 'translateY(110vh) rotate(270deg)', opacity: '0' },
              },
              'sun-pulse': {
                '0%, 100%': { opacity: '0.5', transform: 'scale(0.95)' },
                '50%': { opacity: '1', transform: 'scale(1.05)' },
              },
              'crescent-star-fall': {
                '0%': { transform: 'translateY(-10vh) rotate(-15deg)', opacity: '1' },
                '100%': { transform: 'translateY(110vh) rotate(45deg)', opacity: '0' },
              },
              'gentle-sway': {
                '0%, 100%': { transform: 'rotate(-2deg)' },
                '50%': { transform: 'rotate(2deg)' },
              },
              'santa-walk-body': {
                  '0%, 100%': { transform: 'translateY(0px)' },
                  '50%': { transform: 'translateY(-1px)' },
              },
              'santa-walk-leg-front': {
                  '0%, 100%': { transform: 'rotate(-25deg)' },
                  '50%': { transform: 'rotate(25deg)' },
              },
              'santa-walk-leg-back': {
                  '0%, 100%': { transform: 'rotate(25deg)' },
                  '50%': { transform: 'rotate(-25deg)' },
              },
              'gift-fall': {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                '100%': { transform: 'translateY(20px) scale(0)', opacity: '0' },
              }
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'fade-in-very-fast': 'fade-in 0.2s ease-out forwards',
              'slide-up': 'slide-up 0.5s ease-out forwards',
              'slide-in-stagger': 'slide-in-stagger 0.5s ease-out forwards var(--stagger-delay, 0s)',
              'lift-up': 'lift-up 0.3s ease-out forwards',
              'press': 'press 0.3s ease-out',
              'pulse-border': 'pulse-border 2s ease-in-out infinite',
              'snowfall': 'snowfall var(--duration) linear infinite',
              'diya-float': 'diya-float var(--duration) ease-in-out infinite',
              'gentle-fall': 'gentle-fall var(--duration) linear infinite',
              'sun-pulse': 'sun-pulse var(--duration) ease-in-out infinite',
              'crescent-star-fall': 'crescent-star-fall var(--duration) linear infinite',
              'gentle-sway': 'gentle-sway 4s ease-in-out infinite',
              'santa-walk-body': 'santa-walk-body 0.8s ease-in-out infinite',
              'santa-walk-leg-front': 'santa-walk-leg-front 0.8s ease-in-out infinite',
              'santa-walk-leg-back': 'santa-walk-leg-back 0.8s ease-in-out infinite',
              'gift-fall': 'gift-fall 1s ease-out infinite',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-text">
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
